name: Build Lakh Lead Automaton APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/lakh/leadautomaton
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "LakhLeadAutomaton"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.lakh.leadautomaton'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.lakh.leadautomaton'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="Lakh Lead Automaton"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:colorAccent">#111111</item>

              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/lakh/leadautomaton/MainActivity.kt <<'EOF'
          package com.lakh.leadautomaton

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.graphics.Typeface
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.ScrollView

          class MainActivity : Activity() {

              private lateinit var activityLog: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val scroll = ScrollView(this)

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(24, 28, 24, 28)
                  root.setBackgroundColor(Color.rgb(12, 14, 18))

                  val title = TextView(this)
                  title.text = "LAKH LEAD AUTOMATON"
                  title.textSize = 25f
                  title.setTextColor(Color.WHITE)
                  title.setTypeface(null, Typeface.BOLD)
                  root.addView(title)

                  val subtitle = TextView(this)
                  subtitle.text = "AI Client Hunting • Lead Management"
                  subtitle.textSize = 15f
                  subtitle.setTextColor(Color.LTGRAY)
                  subtitle.setPadding(0, 8, 0, 24)
                  root.addView(subtitle)

                  val status = TextView(this)
                  status.text = "● AUTOMATION READY"
                  status.textSize = 16f
                  status.setTextColor(Color.rgb(80, 220, 130))
                  status.setPadding(0, 0, 0, 20)
                  root.addView(status)

                  addButton(root, "▶ START AUTOMATION",
                      "Automation started. Lead Hunter and Qualification agents are ready.")

                  addButton(root, "⏸ PAUSE AUTOMATION",
                      "Automation paused.")

                  addButton(root, "🔎 LEAD HUNTER",
                      "Lead Hunter: enter business type, location and target client.")

                  addButton(root, "🎯 LEAD QUALIFICATION",
                      "Qualification Agent: scoring leads and checking fit.")

                  addButton(root, "✉ AI OUTREACH",
                      "Outreach Agent: personalized outreach drafts ready.")

                  addButton(root, "💬 AI INBOX",
                      "Inbox Agent: reply classification enabled.")

                  addButton(root, "🔥 HOT LEADS",
                      "Sales Agent: monitoring Interested leads.")

                  addButton(root, "🔔 FOLLOW-UPS",
                      "Follow-up Agent: follow-up queue ready.")

                  addButton(root, "📊 ANALYTICS",
                      "Analytics Agent: pipeline statistics ready.")

                  addButton(root, "⚙ SETTINGS",
                      "Settings opened.")

                  activityLog = TextView(this)
                  activityLog.text = "AGENT ACTIVITY\\nSystem initialized."
                  activityLog.textSize = 14f
                  activityLog.setTextColor(Color.WHITE)
                  activityLog.setPadding(0, 28, 0, 10)
                  root.addView(activityLog)

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun addButton(
                  parent: LinearLayout,
                  label: String,
                  message: String
              ) {
                  val button = Button(this)
                  button.text = label
                  button.textSize = 14f
                  button.setOnClickListener {
                      activityLog.text =
                          "AGENT ACTIVITY\\n✓ $message\\n✓ AI Manager coordinating agents."
                  }

                  parent.addView(
                      button,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lakh-Lead-Automaton
          path: app/build/outputs/apk/debug/app-debug.apk
