name: Build Lakh Lead Automaton APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/lakh/leadautomaton
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LakhLeadAutomaton"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.lakh.leadautomaton'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.lakh.leadautomaton'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/AppTheme"
                  android:label="Lakh Lead Automaton"
                  android:allowBackup="true"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:colorAccent">#111111</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/lakh/leadautomaton/MainActivity.kt <<'EOF'
          package com.lakh.leadautomaton

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.view.Gravity
          import android.widget.*

          class MainActivity : Activity() {

              private lateinit var log: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(24, 24, 24, 24)
                  root.setBackgroundColor(Color.rgb(247,247,249))

                  val title = TextView(this)
                  title.text = "LAKH LEAD AUTOMATON"
                  title.textSize = 25f
                  title.setTextColor(Color.BLACK)
                  title.setTypeface(null, 1)
                  root.addView(title)

                  val sub = TextView(this)
                  sub.text = "AI Company • Manager + Specialized Agents"
                  sub.textSize = 15f
                  sub.setPadding(0, 8, 0, 22)
                  root.addView(sub)

                  val status = TextView(this)
                  status.text = "● AI MANAGER   READY"
                  status.textSize = 16f
                  status.setTextColor(Color.rgb(20,120,60))
                  status.setPadding(0, 0, 0, 18)
                  root.addView(status)

                  addButton(root, "▶ START AUTONOMOUS WORK", "Manager started • Agents working")
                  addButton(root, "⏸ PAUSE AUTOMATION", "Automation paused")
                  addButton(root, "🔎 LEAD HUNTER", "Research Agent → Lead Hunter → Qualification")
                  addButton(root, "✉ AI OUTREACH", "Email Agent → Personalized outreach → Follow-up")
                  addButton(root, "☎ VOICE / CALLING", "Voice Agent ready for approved calling integration")
                  addButton(root, "💬 MESSAGING", "Messaging Agent ready for approved API")
                  addButton(root, "🔥 HOT LEADS", "Sales Agent monitoring interested clients")
                  addButton(root, "📊 ANALYTICS", "Analytics Agent calculating pipeline")

                  log = TextView(this)
                  log.text = "AGENT ACTIVITY\\nSystem ready..."
                  log.textSize = 13f
                  log.setPadding(0, 20, 0, 0)
                  root.addView(log)

                  setContentView(root)
              }

              private fun addButton(parent: LinearLayout, text: String, message: String) {
                  val b = Button(this)
                  b.text = text
                  b.textSize = 14f
                  b.setOnClickListener {
                      log.text = "AGENT ACTIVITY\\n✓ $message\\n✓ AI Manager coordinating agents..."
                  }
                  parent.addView(
                      b,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lakh-Lead-Automaton
          path: app/build/outputs/apk/debug/app-debug.apk
