name: Build Lakh Lead Automaton APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/example/lakhleadautomaton
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LakhLeadAutomaton"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.lakhleadautomaton'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.lakhleadautomaton'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/AppTheme"
                  android:label="Lakh Lead Automaton">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#7C4DFF</item>
                  <item name="android:navigationBarColor">#101014</item>
                  <item name="android:statusBarColor">#101014</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/example/lakhleadautomaton/MainActivity.kt <<'EOF'
          package com.example.lakhleadautomaton

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.widget.*

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this)
                  layout.orientation = LinearLayout.VERTICAL
                  layout.setPadding(28,28,28,28)
                  layout.setBackgroundColor(Color.rgb(16,16,20))

                  val title = TextView(this)
                  title.text = "Lakh Lead Automaton"
                  title.textSize = 28f
                  title.setTextColor(Color.WHITE)
                  layout.addView(title)

                  val subtitle = TextView(this)
                  subtitle.text = "AI Client Hunter"
                  subtitle.textSize = 17f
                  subtitle.setTextColor(Color.LTGRAY)
                  layout.addView(subtitle)

                  val features = arrayOf(
                      "🔎 Lead Hunter",
                      "✉ AI Outreach",
                      "📥 AI Inbox",
                      "💰 Deal Alerts",
                      "📋 Agent Log",
                      "⚙ Settings"
                  )

                  for (item in features) {
                      val b = Button(this)
                      b.text = item
                      layout.addView(b)
                  }

                  setContentView(layout)
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LakhLeadAutomaton-debug
          path: app/build/outputs/apk/debug/app-debug.apk
